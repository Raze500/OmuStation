- type: entity
  parent: BaseItem
  id: MobilePhone
  name: mobile phone
  description: A compact device for sending and receiving NanoChat messages.
  components:
  - type: Sprite
    sprite: Objects/Devices/pda.rsi
    state: pda
  - type: Icon
    sprite: Objects/Devices/pda.rsi
    state: pda
  - type: Item
    size: Small
  - type: NanoChatCard
  - type: MobilePhone
  - type: ActiveRadio
    channels:
    - Common
  - type: ActivatableUI
    key: enum.MobilePhoneUiKey.Key
    inHandsOnly: true
  - type: UserInterface
    interfaces:
      enum.MobilePhoneUiKey.Key:
        type: MobilePhoneBoundUserInterface
